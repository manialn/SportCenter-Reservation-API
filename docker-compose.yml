services:

  app:
    build: .
    image: sport-center
    restart: always
    ports:
      - "8080:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
    networks:
      - backend

  db:
    image: postgres:17
    container_name: sportcenter
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  db_test:
    image: postgres:17
    container_name: sportcenter-test
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: sportcenter_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks:
      - backend

  redis:
    image: redis:8
    container_name: sportcenter-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - backend

volumes:
  postgres_data:
  postgres_test_data:
  redis_data:

networks:
  backend: